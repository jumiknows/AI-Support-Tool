name: Bug
description: Report a reproducible application problem using synthetic data.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic conversation content. Do not paste private health information.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, Node version, and relevant local setup.
    validations:
      required: true
